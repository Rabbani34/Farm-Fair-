<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Farm Fair | Direct Farmer Market</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>
<body>

<!-- HERO SECTION -->

<section class="hero">

  <h1>🌾 FARM FAIR</h1>
  <p>Direct Farmer to Consumer Marketplace</p>

</section>

<!-- MAIN APP -->

<div class="main-container">

<!-- FARMER CARD -->

<div class="card farmer-card">

<h2>👨‍🌾 Farmer Panel</h2>

<input id="farmer" placeholder="Farmer Name">
<input id="crop" placeholder="Crop Name">
<input id="price" placeholder="Price (₹)">
<input id="quantity" placeholder="Quantity (Kg)">
<input id="location" placeholder="Location">
<input id="phone" placeholder="Phone">

<button onclick="addCrop()">Add Crop</button>

</div>


<!-- PRICE PREDICTOR -->

<div class="card predict-card">

<h2>📊 AI Price Predictor</h2>

<input id="predictCrop" placeholder="Speak or type crop name">

<div class="voice-buttons">
<button onclick="startVoiceHindi()">🎤 Hindi</button>
<button onclick="startVoiceEnglish()">🎤 English</button>
</div>

<button onclick="predictPrice()">Predict Price</button>

<h3 id="predictionResult"></h3>

</div>


<!-- BUYER MARKET -->

<div class="card market-card">

<h2>🛒 Crop Marketplace</h2>

<button onclick="loadCrops()">Load Available Crops</button>

<div id="cropList" class="grid"></div>

</div>

</div>


<script src="/static/script.js"></script>

</body>
</html>
