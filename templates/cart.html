<h2>🛒 Your Cart</h2>

<table>
<tr>
<th>Item</th>
<th>Qty</th>
<th>Price</th>
</tr>

{% for item in cart %}
<tr>
<td>{{ item.name }}</td>
<td>{{ item.quantity }}</td>
<td>₹ {{ item.price * item.quantity }}</td>
</tr>
{% endfor %}
</table>

<h3>Total: ₹ {{ total }}</h3>

<form action="/checkout" method="POST">
<button type="submit">Proceed to Payment</button>
</form>
